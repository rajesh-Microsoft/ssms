# Pre-prod nginx. Terminates TLS itself (unlike the dev stack, which sits behind
# production nginx). Deployed to /opt/smms/app/deploy/pprod/nginx.pprod.conf.
#
# Every hostname is pprod-<key>.ssms.yuvaansoft.shop. The API resolves the tenant
# from the FIRST label of the Host header, which would read "pprod-aadya" and 404,
# so every proxy_pass rewrites Host to <key>.yuvaansoft.shop. Same trick the
# dev-* blocks in nginx/nginx.conf already use.
#
# Exact server_names are matched before regex ones, so the admin/portal/www blocks
# below can never be shadowed by the tenant catch-all.

ssl_protocols       TLSv1.2 TLSv1.3;
ssl_ciphers         HIGH:!aNULL:!MD5;

# Redirect all plain HTTP to HTTPS.
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# ── Super-admin control plane (pprod-admin.ssms.yuvaansoft.shop) ──
server {
    listen 443 ssl;
    server_name pprod-admin.ssms.yuvaansoft.shop;

    ssl_certificate     /etc/letsencrypt/live/ssms.yuvaansoft.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ssms.yuvaansoft.shop/privkey.pem;

    add_header X-Robots-Tag "noindex, nofollow" always;

    root /usr/share/nginx/html/admin;
    index index.html;

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://smms-api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host admin.yuvaansoft.shop;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# ── SSMS product portal (pprod-ssms.ssms.yuvaansoft.shop) ──
server {
    listen 443 ssl;
    server_name pprod-ssms.ssms.yuvaansoft.shop;

    ssl_certificate     /etc/letsencrypt/live/ssms.yuvaansoft.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ssms.yuvaansoft.shop/privkey.pem;

    add_header X-Robots-Tag "noindex, nofollow" always;

    root /usr/share/nginx/html/portal;
    index index.html;

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://smms-api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host ssms.yuvaansoft.shop;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# ── Marketing site (pprod-www.ssms.yuvaansoft.shop) ──
server {
    listen 443 ssl;
    server_name pprod-www.ssms.yuvaansoft.shop;

    ssl_certificate     /etc/letsencrypt/live/ssms.yuvaansoft.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ssms.yuvaansoft.shop/privkey.pem;

    add_header X-Robots-Tag "noindex, nofollow" always;

    root /usr/share/nginx/html/www;
    index index.html;

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}

# ── Look-alike dev hosts (dev-*.ssms.yuvaansoft.shop) ──
# Nothing points a dev-* record at this VM today. The block below is the
# catch-all, so if one ever appeared it would be served this stack's real data
# behind a hostname that reads like development. Refuse the shape outright.
# Regex server_names are tried in order, so this must stay above the catch-all.
server {
    listen 443 ssl;
    server_name ~^dev-.*\.ssms\.yuvaansoft\.shop$;

    ssl_certificate     /etc/letsencrypt/live/ssms.yuvaansoft.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ssms.yuvaansoft.shop/privkey.pem;

    add_header X-Robots-Tag "noindex, nofollow" always;
    default_type text/plain;

    return 404 "This hostname does not exist.\nPre-production is pprod-<tenant>.ssms.yuvaansoft.shop.\nDevelopment is dev-<tenant>.yuvaansoft.shop on a different server.\n";
}

# ── Every society subdomain (pprod-aadya, pprod-demo, ...) ──
server {
    listen 443 ssl default_server;
    server_name ~^pprod-(?<tenant>[a-z0-9-]+)\.ssms\.yuvaansoft\.shop$;

    ssl_certificate     /etc/letsencrypt/live/ssms.yuvaansoft.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ssms.yuvaansoft.shop/privkey.pem;

    # Pre-prod carries a copy of real resident data; keep it out of search results.
    add_header X-Robots-Tag "noindex, nofollow" always;

    root /usr/share/nginx/html;
    index home.html index.html;

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /home.html;
    }

    location /api/ {
        proxy_pass http://smms-api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $tenant.yuvaansoft.shop;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
