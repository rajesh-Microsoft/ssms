# Dev-stack nginx, deployed to ~/smms-dev/SMMS/nginx/nginx.dev-vm.conf
#
# This sits BEHIND the production nginx, which terminates TLS on 443 and
# rewrites the Host header from dev-<name>.yuvaansoft.shop to
# <name>.yuvaansoft.shop before proxying here. So the server_name blocks below
# are the same ones production matches on, and the API's Host-based tenant
# resolution works unchanged.
#
# No TLS and no HTTP->HTTPS redirect here on purpose: TLS already terminated
# upstream, and a redirect at this layer would send the browser to the
# production hostname and silently leave the dev stack.

# ── Super-admin control plane (dev-admin.yuvaansoft.shop) ──
server {
    listen 80;
    server_name admin.localhost admin.smms.local admin.yuvaansoft.shop admin.ssms.yuvaansoft.shop;

    root /usr/share/nginx/html/admin;
    index index.html;

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://smms-api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# ── SSMS product portal (dev-ssms.yuvaansoft.shop) ──
server {
    listen 80;
    server_name ssms.yuvaansoft.shop;

    root /usr/share/nginx/html/portal;
    index index.html;

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://smms-api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# ── YuvaanSoft company marketing site (dev-www.yuvaansoft.shop) ──
server {
    listen 80;
    server_name www.yuvaansoft.shop yuvaansoft.shop;

    root /usr/share/nginx/html/www;
    index index.html;

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}

# ── Every society subdomain (dev-demo, dev-aadya, ...) ──
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index home.html index.html;

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /home.html;
    }

    location /api/ {
        proxy_pass http://smms-api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
