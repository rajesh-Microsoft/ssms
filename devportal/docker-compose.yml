# Hosted copy of the DevOps portal. Deliberately read-only:
#   Portal__AllowWrites=false        deploy and rollback refuse regardless of who signs in
#   Portal__RequireAuthForReads=true server names and commits stay behind the login
#
# The Docker socket is NOT mounted. This service is reachable from the internet, and a
# socket mount would hand any compromise root on the host. The cost is that container
# status is unavailable here; the portal says so rather than guessing.
name: smms-devportal

services:
  devportal-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: devportal-api
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Hosted
      Portal__AllowWrites: "false"
      Portal__RequireAuthForReads: "true"
      Portal__CacheSeconds: "30"
      Portal__RepositoryName: rrathore_microsoft/SMMS
      Portal__RepositoryUrl: https://github.com/rrathore_microsoft/SMMS
    volumes:
      - ./appsettings.Hosted.json:/app/appsettings.Hosted.json:ro
      # Signing key and operator hashes, generated on the box. Mounted rather than passed
      # as env vars because compose eats the '$' separators in a PBKDF2 hash.
      - ./secrets.json:/app/appsettings.Secrets.json:ro
      - /home/ssmsadmin/smms-dev/SMMS:/stacks/dev:ro
      - /home/ssmsadmin/smms/SMMS:/stacks/uat:ro
      # Pre-prod is on another VM this container cannot reach. Its DEPLOYED_* files are
      # mirrored here by deploy/pprod/mirror-state.ps1 after each promotion.
      - ./state/pprod:/stacks/pprod:ro

  devportal-ui:
    image: nginx:alpine
    container_name: devportal-ui
    restart: unless-stopped
    depends_on:
      - devportal-api
    ports:
      # Bound to the docker bridge only. Production nginx proxies to it; nothing is
      # published on 0.0.0.0.
      - "172.17.0.1:8082:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./css:/usr/share/nginx/html/css:ro
      - ./js:/usr/share/nginx/html/js:ro
      - ./nginx.portal.conf:/etc/nginx/conf.d/default.conf:ro
