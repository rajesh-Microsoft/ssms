# Local-dev mirror of nginx.conf: same host routing, HTTP only.
# The production config terminates TLS with Let's Encrypt certs that do not
# exist on a dev machine, and 301-redirects port 80 to HTTPS. Both make local
# testing impossible, so this variant drops SSL and serves everything on :80.
# Browse via *.localtest.me (public wildcard DNS -> 127.0.0.1), never plain
# localhost: tenant resolution reads the first host label, and a single-label
# host resolves no tenant.

# ── Super-admin control plane ──
server {
    listen 80;
    server_name admin.localhost admin.smms.local admin.localtest.me;

    root /usr/share/nginx/html/admin;
    index index.html;

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://smms-api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

