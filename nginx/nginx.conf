# ── Super-admin control plane (admin.localhost / admin.<domain>) ──
# A more specific server_name wins over the catch-all "_" below, so this
# block serves the separate platform SPA from UI/admin/ while the default
# block keeps serving the tenant SPA for every society subdomain. Both proxy
# /api/ to the same API; the API resolves the control plane from the Host
# subdomain "admin" (forwarded via proxy_set_header Host $host).
# Redirect all plain HTTP to HTTPS for every host
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {

    listen 443 ssl;

    server_name admin.localhost admin.smms.local admin.yuvaansoft.shop admin.ssms.yuvaansoft.shop;

    ssl_certificate     /etc/letsencrypt/live/yuvaansoft.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yuvaansoft.shop/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html/admin;

    index index.html;

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://smms-api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# ── SSMS product portal (ssms.yuvaansoft.shop) ──
# Public marketing + Register Society. No login here (society users go to their
# own subdomain; super-admin uses admin.ssms.yuvaansoft.shop). Served from UI/portal/.
server {
    listen 443 ssl;
    server_name ssms.yuvaansoft.shop;

    ssl_certificate     /etc/letsencrypt/live/yuvaansoft.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yuvaansoft.shop/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html/portal;
    index index.html;

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://smms-api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# ── YuvaanSoft company marketing site (www + apex) ──
server {
    listen 443 ssl;
    server_name www.yuvaansoft.shop yuvaansoft.shop;

    ssl_certificate     /etc/letsencrypt/live/yuvaansoft.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yuvaansoft.shop/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html/www;
    index index.html;

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}

server {

    listen 443 ssl default_server;

    server_name _;

    ssl_certificate     /etc/letsencrypt/live/yuvaansoft.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yuvaansoft.shop/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;

    index home.html index.html;

    location / {
        # Always revalidate app files against the server (cheap 304s) so a
        # browser never serves stale HTML/JS/CSS after a UI update. Without
        # this, nginx omits Cache-Control and browsers heuristically cache
        # app.js — leaving users on old code (e.g. missing new features).
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /home.html;
    }

    location /api/ {

        proxy_pass http://smms-api:8080/api/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header X-Real-IP $remote_addr;
    }
}

# ── Look-alike dev hosts (dev-*.ssms.yuvaansoft.shop) ──
# These LOOK like the dev stack and are not: they miss the dev regex below and
# land on the catch-all `_` block, which serves UAT with real resident data.
# Someone signed in here believing it was dev. Refuse the hostname outright
# rather than quietly serving production behind a dev-looking URL.
#
# Deliberately a 404 and not a redirect to the real dev host: a guard that
# silently rewrites the address teaches nobody which hostname is correct.
server {
    listen 443 ssl;
    server_name ~^dev-.*\.ssms\.yuvaansoft\.shop$;

    ssl_certificate     /etc/letsencrypt/live/yuvaansoft.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yuvaansoft.shop/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header X-Robots-Tag "noindex, nofollow" always;
    default_type text/plain;

    return 404 "This hostname does not exist.\nDevelopment is dev-<tenant>.yuvaansoft.shop (no \".ssms.\").\nPre-production is pprod-<tenant>.ssms.yuvaansoft.shop.\n";
}

# ── DevOps portal (dev-portal.yuvaansoft.shop) ──
# MUST stay above/independent of the dev regex below: "dev-portal" also matches
# ^dev-(...)\.yuvaansoft\.shop, which would proxy it to the dev SMMS stack on
# 8081 and silently serve the society site instead. nginx prefers an exact
# server_name over any regex, so naming it here settles the conflict.
server {
    listen 443 ssl;
    server_name dev-portal.yuvaansoft.shop;

    ssl_certificate     /etc/letsencrypt/live/yuvaansoft.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yuvaansoft.shop/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://172.17.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# ── Dev stack (dev-*.yuvaansoft.shop) ──
# Routes to the separate `smms-dev` Compose project on this VM. Additive only:
# nginx matches exact server_names before regex ones, so none of the blocks
# above can be shadowed by this.
#
# proxy_pass uses a literal IP, not a container name, on purpose. nginx resolves
# upstream hostnames at startup, so naming the dev container would make
# production nginx refuse to start whenever the dev stack is down.
#
# Host is rewritten dev-<name>.yuvaansoft.shop -> <name>.yuvaansoft.shop so the
# API's subdomain-based tenant resolution works unchanged behind the proxy.
server {
    listen 443 ssl;
    server_name ~^dev-(?<devname>[a-z0-9-]+)\.yuvaansoft\.shop$;

    ssl_certificate     /etc/letsencrypt/live/yuvaansoft.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yuvaansoft.shop/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # This stack carries a copy of real resident data; keep it out of search results.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://172.17.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $devname.yuvaansoft.shop;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}