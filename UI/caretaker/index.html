<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="theme-color" content="#0f172a"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Caretaker — SMMS</title>
<link rel="stylesheet" href="caretaker.css"/>
</head>
<body>

<!-- ── Login ── -->
<section id="loginView">
  <div class="login card">
    <h2>Caretaker</h2>
    <p>Sign in to start the day.</p>
    <div id="loginMsg"></div>
    <label for="username">Username</label>
    <input id="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false"/>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password"/>
    <button class="btn" id="loginBtn">Sign in</button>
  </div>
</section>

<!-- ── App ── -->
<section id="appView" class="hidden">
  <div class="bar">
    <div class="grow">
      <h1 id="screenTitle">Today</h1>
      <div class="who" id="whoAmI"></div>
    </div>
    <button id="logoutBtn">Exit</button>
  </div>

  <div class="wrap">
    <div id="msg"></div>

    <!-- Home -->
    <div id="homeScreen">
      <div class="tiles">
        <div class="tile"><div class="n" id="cVisitors">0</div><div class="l">Visitors today</div></div>
        <div class="tile"><div class="n" id="cInside">0</div><div class="l">Still inside</div></div>
        <div class="tile"><div class="n" id="cParcels">0</div><div class="l">Parcels waiting</div></div>
        <div class="tile"><div class="n" id="cIssues">0</div><div class="l">Open issues</div></div>
      </div>

      <div class="menu">
        <button data-go="visitors"><span class="ico">👤</span> Visitor entry</button>
        <button data-go="deliveries"><span class="ico">📦</span> Deliveries <span class="badge hidden" id="parcelBadge">0</span></button>
        <button data-go="issue"><span class="ico">🔧</span> Report a problem</button>
        <button data-go="checklist"><span class="ico">📋</span> Daily checklist <span class="badge hidden" id="checkBadge">to do</span></button>
      </div>
    </div>

    <!-- Visitors -->
    <div id="visitorsScreen" class="hidden">
      <button class="btn ghost back" data-go="home">← Back</button>
      <div class="card">
        <h3>New visitor</h3>
        <label for="vName">Name</label>
        <input id="vName" type="text" autocapitalize="words"/>
        <label for="vFlat">Going to flat</label>
        <select id="vFlat"><option value="">Select flat</option></select>
        <label>Purpose</label>
        <div class="chips" id="purposeChips"></div>
        <label for="vMobile">Mobile (optional)</label>
        <input id="vMobile" type="tel" inputmode="numeric" autocomplete="off"/>
        <label for="vVehicle">Vehicle number (optional)</label>
        <input id="vVehicle" type="text" autocapitalize="characters"/>
        <button class="btn" id="vSave">Save entry</button>
      </div>
      <h3>Today</h3>
      <label class="search-label" for="vSearch">Find a visitor</label>
      <input class="list-search" id="vSearch" type="search" placeholder="Name, flat, mobile or vehicle" autocomplete="off"/>
      <div id="visitorList"></div>
      <div class="pad"></div>
    </div>

    <!-- Deliveries -->
    <div id="deliveriesScreen" class="hidden">
      <button class="btn ghost back" data-go="home">← Back</button>
      <div class="card">
        <h3>New parcel</h3>
        <label>Courier</label>
        <div class="chips" id="courierChips"></div>
        <label for="dFlat">For flat</label>
        <select id="dFlat"><option value="">Select flat</option></select>
        <button class="btn" id="dSave">Save parcel</button>
      </div>
      <h3>Waiting &amp; today</h3>
      <label class="search-label" for="dSearch">Find a parcel</label>
      <input class="list-search" id="dSearch" type="search" placeholder="Courier, flat or collected by" autocomplete="off"/>
      <div id="deliveryList"></div>
      <div class="pad"></div>
    </div>

    <!-- Issue -->
    <div id="issueScreen" class="hidden">
      <button class="btn ghost back" data-go="home">← Back</button>
      <div class="card">
        <h3>What is the problem?</h3>
        <div class="chips" id="issueChips"></div>
        <label for="iWhere">Where is it? (optional)</label>
        <input id="iWhere" type="text" placeholder="Near Block B"/>
        <label for="iPhoto">Photo (optional)</label>
        <input id="iPhoto" type="file" accept="image/*" capture="environment"/>
        <label for="iNote">Anything to add? (optional)</label>
        <textarea id="iNote"></textarea>
        <button class="btn" id="iSave">Send to committee</button>
      </div>
      <h3>Recently reported</h3>
      <div id="issueList"></div>
      <div class="pad"></div>
    </div>

    <!-- Checklist -->
    <div id="checklistScreen" class="hidden">
      <button class="btn ghost back" data-go="home">← Back</button>
      <div id="checklistState" class="sub"></div>
      <div id="checkItems"></div>
      <label for="cNotes">Notes (optional)</label>
      <textarea id="cNotes"></textarea>
      <button class="btn" id="cSave">Submit round</button>
      <div class="pad"></div>
    </div>
  </div>
</section>

<dialog id="collectionDialog" aria-labelledby="collectionTitle">
  <form id="collectionForm">
    <h2 id="collectionTitle">Hand over parcel</h2>
    <p>Record who collected it.</p>
    <label for="collectedBy">Collected by</label>
    <input id="collectedBy" type="text" maxlength="100" autocapitalize="words" autocomplete="off" required/>
    <div class="dialog-actions">
      <button class="btn ghost" id="collectionCancel" type="button">Cancel</button>
      <button class="btn" id="collectionConfirm" type="submit">Confirm handover</button>
    </div>
  </form>
</dialog>

<dialog id="photoDialog" aria-labelledby="photoTitle">
  <div class="photo-view">
    <h2 id="photoTitle">Reported photo</h2>
    <img id="photoImg" alt="Photo attached to this report"/>
    <button class="btn ghost" id="photoClose" type="button">Close</button>
  </div>
</dialog>

<script src="../api.js"></script>
<script src="caretaker.js"></script>
</body>
</html>
