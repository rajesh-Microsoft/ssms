<div class="kpi-grid" id="pay-kpi"></div>

<div class="card">
  <div class="card-hdr"><h3>🏦 Payment Setup (UPI &amp; Bank)</h3></div>
  <p class="mhint">These details drive the QR codes residents scan to pay. UPI ID and Payee Name are required for online payments.</p>
  <div class="form-grid">
    <div class="form-group"><label>UPI ID *</label><input type="text" id="upi-id" placeholder="society@okhdfcbank"></div>
    <div class="form-group"><label>Payee Name *</label><input type="text" id="upi-payee" placeholder="NLC Aadya Society"></div>
    <div class="form-group"><label>Bank Name</label><input type="text" id="upi-bank"></div>
    <div class="form-group"><label>Account Name</label><input type="text" id="upi-acname"></div>
    <div class="form-group"><label>Account Number</label><input type="text" id="upi-acnum"></div>
    <div class="form-group"><label>IFSC</label><input type="text" id="upi-ifsc"></div>
  </div>
  <div class="form-actions">
    <button class="btn btn-primary" onclick="saveUpiSettingsForm()">💾 Save Payment Setup</button>
  </div>
</div>

<div class="card">
  <div class="card-hdr">
    <h3>🧾 Payment Verifications</h3>
    <select id="payStatusF" onchange="renderPaymentsAdmin()" style="width:auto;">
      <option value="Pending">Pending</option><option value="Approved">Approved</option><option value="Rejected">Rejected</option><option value="">All</option>
    </select>
  </div>
  <div class="tbl-wrap">
    <table><thead><tr><th>Submitted</th><th>Flat</th><th>Member</th><th>Invoice</th><th>Period</th><th>Amount</th><th>UPI Ref</th><th>Proof</th><th>Status</th><th>Action</th></tr></thead>
    <tbody id="pay-tbody"></tbody></table>
  </div>
</div>
