<div class="card">
  <div class="card-hdr"><h3>📦 Parcels for my flat</h3>
    <div class="search-row"><span class="badge b-unpaid" id="mgate-waiting">0 waiting</span></div>
  </div>
  <div class="tbl-wrap">
    <table><thead><tr><th>Received</th><th>Courier</th><th>Status</th><th>Collected</th><th>Collected by</th></tr></thead>
    <tbody id="mgate-parcels-tbody"></tbody></table>
  </div>
</div>

<div class="card">
  <div class="card-hdr"><h3>👤 Visitors to my flat</h3>
    <div class="search-row"><span class="badge b-paid" id="mgate-inside">0 inside</span></div>
  </div>
  <div class="tbl-wrap">
    <table><thead><tr><th>In</th><th>Out</th><th>Name</th><th>Purpose</th><th>Vehicle</th></tr></thead>
    <tbody id="mgate-visitors-tbody"></tbody></table>

</div>
