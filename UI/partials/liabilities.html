<div class="card">
  <div class="card-hdr">
    <h3>Society Liabilities</h3>
    <div class="search-row">
      <input type="text" id="liabSearch" placeholder="🔍 Search..." oninput="renderLiabilities()" style="width:160px;">
      <select id="liabStatusF" onchange="renderLiabilities()" style="width:auto;">
        <option value="">All Statuses</option>
        <option value="Open">Open</option>
        <option value="PartiallySettled">Partially Settled</option>
        <option value="Settled">Settled</option>
      </select>
      <button class="btn btn-primary" data-perm="Liabilities" onclick="openLiabilityModal()">＋ Record</button>
    </div>
  </div>
  <p style="color:var(--sub);font-size:13px;margin:0 0 10px;">Money the society owes back to members or the treasurer for expenses they funded out of pocket. Settle by repaying cash (books an expense) or by converting to the member's advance wallet.</p>
  <div id="liab-summary" style="margin-bottom:10px;display:flex;gap:10px;flex-wrap:wrap;"></div>
  <div class="tbl-wrap">
    <table><thead><tr><th>#</th><th>Contributor</th><th>Source</th><th>Date</th><th>Amount</th><th>Outstanding</th><th>Pending</th><th>Purpose</th><th>Status</th><th>Actions</th></tr></thead>
    <tbody id="liab-tbody"></tbody></table>
  </div>
  <div class="pagination" id="liab-pagination"></div>
</div>
